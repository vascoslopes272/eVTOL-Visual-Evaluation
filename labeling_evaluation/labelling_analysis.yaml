# -----------------------------------------------------------------------------
# analysis constants — every threshold the document states, in one place
# -----------------------------------------------------------------------------
analysis:
  # 2026-10-11: Part I external inputs (evtol.news year, TRL, AAM index company map) come from the rule-based scripts
  # (viz/script_inputs.py, written by notebook 60), the author's reading where he read the item; 'reading' = the old inputs
  external_inputs: script
  # the analysis unit: representative (wizard-approved, passes the domain gate) primary aircraft
  domain_gate_tags: [UAVSimilar, ElectricSimilar, STOLSimilar]
  whole_vehicle_part: "Whole Vehicle Layout"
  # time
  last_complete_year: 2023              # counts and trends stop here
  partial_window_start: 2024            # drawn hatched, labelled partial
  publication_lag_p90_years: 3
  windows:                              # label: [first, last] priority year (archive a2.WINDOWS)
    "<= 2011":           [0, 2011]
    "2012-15":           [2012, 2015]
    "2016-19":           [2016, 2019]
    "2020-23":           [2020, 2023]
    "2024-26 (partial)": [2024, 2100]
  # the evtol.news fold of the wizard class G1 (ruling 2026-09-22)
  class_fold: {SLC: LC, TR: VT, TW: VT, CVT: VT, TB: VT, PTC: VT, DS: VT, MR: WM, RC: ER, SRW: LC, HB: HB, PFV: HB} #SRW is LC, but the wizard ruled it is a "special case" of LC, so it is folded into LC for the analysis
  # tests 
  alpha: 0.05
  trend_min_n: 20                       # driver traces: class needs ≥ 20 aircraft
  rarefy_n: 40                          # Hill numbers / dominant design rarefied to n aircraft Why 40? 40 is a good number for rarefaction because it provides a reasonable balance between statistical power and computational efficiency.
  random_seed: 42                       #why 42? 42 is the answer to life, the universe, and everything. It is also a good seed for random number generators because it is a small integer that is easy to remember and reproduce. Using a fixed seed ensures that the results of the analysis are reproducible, which is important for scientific research.
  # draws and permutation counts differ per test in the archived code (hill 1000, dominant_design 200,
  # sm_open 5000); they are listed per lib function when lib/ is ported (step 2)
  firm_tier_min_aircraft: 5             # firm profiles only for firms with ≥ 5 aircraft
  # question 2 (the design space)
  field_drop_top_share: 0.88            # Table 6 leaves out a field whose top answer holds this share or more
  zone_min_aircraft: 5                  # Figure 8: C·U archetypes read when they hold at least this many aircraft
  filer_panel_min_aircraft: 20          # Figure 7: archetypes on which one filer moves the ratio by a small step
  archetype_screens:                    # the four screens of the archetype sets, fixed before they were compared
    big_archetype_aircraft: 5           # an archetype is 'big' with at least this many aircraft
    big_archetype_share: 0.05           # ... and 'readable' with at least this share of the corpus
    max_singleton_share: 0.05           # at most this share of the aircraft alone in their archetype
    min_share_in_big: 0.90              # at least this share of the aircraft in big archetypes
    min_big_share_archetypes: 3         # at least this many archetypes with 5 % or more
  discovery_orders: 400                 # tie orderings drawn inside a priority year (discovery curve)
  discovery_tail: 100                   # the last aircraft the curve is read on
  evtolnews_min_n: 30                   # Figure 2 / 3.1: a window is compared with the directory when both sources hold this many dated aircraft
  check_tolerance: 0.0005               # |notebook − document| allowed when checking a number

# -----------------------------------------------------------------------------
# style — defaults until the thesis template is known (re-run 39–45 after changing)
# -----------------------------------------------------------------------------
style:
  base: [science, no-latex]             # SciencePlots styles, applied in this order
  text_width_in: 6.3                    # TO CONFIRM: \the\textwidth of the thesis, in inches
  column_gap_in: 0.25
  font_family: serif
  font: "DejaVu Serif"                  # TO CONFIRM: thesis body font (or a close match)
  base_font_pt: 9
  small_font_pt: 8
  min_font_pt: 7
  dpi_png: 300
  formats: [pdf, png]
  palette: okabe_ito                    # colour-blind safe; class → colour/marker/dash/hatch in viz/style.py
  print_bw_safe: true

