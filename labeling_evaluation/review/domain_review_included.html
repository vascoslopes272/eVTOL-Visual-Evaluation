, "file:///mnt/storage_11tb/Drive_files_to_syncronize/3%20-%20Images%20DataSets%20%26%20Labelling%20Outputs/EVTOLNEWS_DS/0_source/images/smolensk-joint-development-evtol/01_AEROTAKSI_KTRV_MAKS-2021_10.jpg"]}], "pool_n": 871, "mode": "included", "opts": [["in_domain", "confirm in domain"], ["exclude", "override: actually out of the domain"]]};
const KEY = D.mode === 'included' ? 'domainReviewIncluded_v1' : 'domainReview_v1';
let S = {v: {}, t: {}, g: {}, exp: {}};
try { S = Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function escs(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const ALL = D.contradictions.concat(D.sample);
ALL.forEach((it, i) => { it.n = i; });
const reasons = Array.from(new Set(D.sample.map(it => it.reason))).sort();
const val = it => S.v[it.key] || it.cur;
function saveToFolder(blob, name){
  function fallback(){ var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); return Promise.resolve('downloads'); }
  if (!window.showSaveFilePicker) return fallback();
  return window.showSaveFilePicker({suggestedName: name, id: 'review_decisions'})
    .then(function(h){ return h.createWritable().then(function(w){ return w.write(blob).then(function(){ return w.close(); }); }); })
    .then(function(){ return 'folder'; }).catch(function(e){ return (e && e.name === 'AbortError') ? 'cancelled' : fallback(); });
}
function opts(it){
  return '<div class="opts">' + D.opts.map(o => '<button class="o' + (val(it) === o[0] ? ' sel' : '') + (it.cur === o[0] ? ' was' : '') + '" data-k="' + it.n + '" data-v="' + o[0] + '">' + escs(o[1]) + '</button>').join('') + '</div>';
}
const HL_C = /hybrid|fuel cells?|turbines?|engines?|\bgas\b|hydrogen|combustion|petrol|gasoline|diesel|kerosene|jet-a1?|fuel/gi;
const HL_U = /cargo[- ]only|air cargo|cargo|drones?|unmanned|uncrewed|uninhabited|no passengers|remote(?:ly)?[- ]?(?:controlled|piloted)?|autonomous|pilotless|delivery|freight|logistic|spray|agricultur/gi;
function hl(s, it){ if (D.mode === 'included') return escs(s).replace(HL_C, m => '<mark>' + m + '</mark>').replace(HL_U, m => m.indexOf('<') < 0 ? '<mark>' + m + '</mark>' : m); const re = it.why.indexOf('combustion') === 0 ? HL_C : HL_U; return escs(s).replace(re, m => '<mark>' + m + '</mark>'); }
function citeHTML(it){
  const x = it.best;
  const same = it.text && it.text.indexOf(x.text.trim()) === 0;
  return '<div class="ev"><small>' + escs(x.kind) + ' <a href="' + escs(x.link) + '" target="evtolnews">open page ↗</a></small>“' + hl(x.text, it) + '”</div>'
    + (it.text && !same ? '<div class="spec"><b>Spec sheet:</b> ' + hl(it.text, it) + '</div>' : '');
}
function imgsHTML(it){ return (it.imgs && it.imgs.length) ? '<div class="imgs">' + it.imgs.map(u => '<a href="' + escs(u) + '" target="_blank"><img loading="lazy" src="' + escs(u) + '"></a>').join('') + '</div>' : ''; }
function card(it){
  const ch = val(it) !== it.cur;
  return '<div class="c ' + (it.section === 'A' ? 'contra ' : '') + (ch ? 'changed' : (S.v[it.key] ? 'kept' : '')) + '" id="it-' + it.n + '">'
    + '<div class="meta"><b style="font-size:16px"><a href="' + escs(it.url) + '" target="evtolnews">' + escs(it.title) + '</a></b>' + (it.patented ? ' <span class="b">patent-linked</span>' : '') + '</div>'
    + '<div style="margin:3px 0;font-weight:700;color:#8a5a00">' + (D.mode === 'included' ? 'Kept in the domain — is it really a passenger/crewed, not combustion-only aircraft?' : 'Excluded because: ' + escs(it.why)) + '</div>'
    + citeHTML(it) + imgsHTML(it)
    + opts(it) + '</div>';
}
function rowHTML(it){
  return '<div class="row" id="it-' + it.n + '"><span style="flex:1;min-width:260px"><b><a href="' + escs(it.url) + '" target="evtolnews">' + escs(it.title) + '</a></b> · ' + escs(it.why) + '<br><span class="sub">' + citeHTML(it) + '</span></span>' + opts(it) + '</div>';
}
function sideHTML(cur){
  let h = D.contradictions.length ? '<h4>A. Contradictions (' + D.contradictions.length + ')</h4>' : '';
  D.contradictions.forEach(it => { h += '<div class="si contra ' + dot(it) + (cur === it.n ? ' active' : '') + '" data-n="' + it.n + '">' + (it.n + 1) + '. ' + escs(it.title) + '</div>'; });
  reasons.forEach(r => {
    const items = D.sample.filter(it => it.reason === r);
    h += '<h4>B. ' + escs(r) + ' (' + items.length + ')</h4>';
    items.forEach(it => { h += '<div class="si ' + dot(it) + (cur === it.n ? ' active' : '') + '" data-n="' + it.n + '">' + (it.n + 1) + '. ' + escs(it.title) + '</div>'; });
  });
  return h;
}
function dot(it){ const v = S.v[it.key]; return !v ? '' : (v === it.cur ? 'excl' : 'ind'); }
let cur = null;
function render(){
  let h = D.contradictions.length ? '<h2>A. Contradictions (' + D.contradictions.length + ')</h2><div class="sub">excluded by the rule, but linked to a patent in your dataset — check each one</div>' : '';
  if (D.contradictions.length) h += '<div class="grid">' + D.contradictions.map(card).join('') + '</div>';
  h += '<h2>B. Spot-check sample (' + D.sample.length + ' of ' + D.pool_n + ')</h2>';
  reasons.forEach(r => {
    const items = D.sample.filter(it => it.reason === r);
    h += '<h3 style="margin:16px 0 6px">' + escs(r) + ' <span class="sub">(' + items.length + ' in the sample)</span></h3><div class="grid">' + items.map(card).join('') + '</div>';
  });
  document.getElementById('main').innerHTML = h;
  document.getElementById('side').innerHTML = sideHTML(cur);
  count();
}
function count(){
  const n = ALL.filter(it => S.v[it.key]).length;
  const gdone = Object.values(S.g).filter(Boolean).length;
  document.getElementById('count').textContent = n + ' / ' + ALL.length + ' individually decided · ' + gdone + ' group' + (gdone === 1 ? '' : 's') + ' bulk-confirmed';
}
function goto(n){
  const it = ALL[n]; cur = n;
  if (it.section === 'B') { S.exp[it.reason] = true; persist(); }
  render();
  const el = document.getElementById('it-' + n);
  if (el) { el.scrollIntoView({block: 'center', behavior: 'smooth'}); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1600); }
}
document.addEventListener('click', e => {
  const si = e.target.closest('.si');
  if (si) { goto(+si.dataset.n); return; }
  const b = e.target.closest('button.o[data-k]');
  if (b) { const it = ALL[+b.dataset.k]; S.v[it.key] = b.dataset.v; persist(); cur = it.n; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  const gb = e.target.closest('.gbtn');
  if (gb) { const r = reasons[+gb.dataset.gi]; S.g[r] = !S.g[r]; persist(); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  const tg = e.target.closest('[data-toggle]');
  if (tg) { const r = reasons[+tg.dataset.toggle]; S.exp[r] = !S.exp[r]; persist(); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
});
document.getElementById('export').onclick = () => {
  const q = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
  const head = ['slug_key', 'section', 'reason', 'cur', 'decision', 'note'];
  const rows = [];
  ALL.forEach(it => { if (S.v[it.key]) rows.push([it.key, it.section, it.reason || '', it.cur, S.v[it.key], ''].map(q).join(',')); });
  reasons.forEach(r => { if (S.g[r]) rows.push(['(group)', 'B', r, 'exclude', 'confirmed_group', ''].map(q).join(',')); });
  saveToFolder(new Blob([head.map(q).join(',') + '\n' + rows.join('\n') + '\n'], {type: 'text/csv'}), D.mode === 'included' ? 'DOMAIN_INCLUDED_REVIEW_DECISIONS.csv' : 'DOMAIN_REVIEW_DECISIONS.csv')
    .then(w => { if (w !== 'cancelled') alert('Saved (' + w + '). Tell Claude it is exported.'); });
};
if (D.mode === 'included') document.getElementById('rule').innerHTML = '<b>Checking the pages the rules KEPT in the domain.</b> Random sample (seed 42, 95% CI, e = 10%) of ' + D.sample.length + ' of the ' + D.pool_n + ' kept pages. Read the spec line and the photos. Confirm if it can carry people and is not combustion-only (an electric option counts as electric); override if it is really a cargo/unmanned drone or combustion-only. Yellow = words that suggest an exclusion reason. Click a name on the left to jump.'; else document.getElementById('rule').innerHTML = '<b>Rule checked:</b> a page is in domain when its power source is not combustion-only (an electric option counts as electric) and it is not a UAV (cargo-only, no-passengers, cargo drone, or cargo/drone by type or name with no person in the capacity; a page saying it can carry people stays in). <b>A</b> = ' + D.contradictions.length + ' excluded pages linked to a patent in your dataset (all reviewed). <b>B</b> = random sample (seed 42, 95% CI, e = 10%) of ' + D.sample.length + ' of the other ' + D.pool_n + ' excluded pages. Yellow = the words that triggered the exclusion. Read the quote and the photos, then confirm or override; click a name on the left to jump.';
function fitHeader(){ document.documentElement.style.setProperty('--hh', document.getElementById('hdr').offsetHeight + 'px'); }
window.addEventListener('resize', fitHeader);
render(); fitHeader();
</script></body></html>
